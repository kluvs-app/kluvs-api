#
# Reports breaking API changes on every PR that touches the spec (report only; never fails).
# Breaking changes are sometimes intended. This makes them visible before merge, so the
# matching backend/client work can be planned. Results appear as annotations on the PR, in
# the job summary and, when there are breaking changes, as a PR comment linking to a
# side-by-side review on oasdiff.com (specs are encrypted client-side before upload).
#

name: Breaking Changes

on:
  pull_request:
    branches: [main]
    paths:
      - openapi.json
      - .github/workflows/breaking-changes.yml

permissions:
  contents: read
  pull-requests: write # lets the action comment the oasdiff.com review link on the PR

jobs:
  breaking:
    name: Report breaking changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract base spec
        run: git show "origin/${{ github.base_ref }}:openapi.json" > base-openapi.json

      - name: Check for breaking changes
        # oasdiff/oasdiff-action v0.2.1
        uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee
        with:
          base: base-openapi.json
          revision: openapi.json
          # Report only: no fail-on. The review upload and PR comment use the action's defaults
          # (review: true, github-token: github.token).
