#
# Publishes docs.kluvs.com (Scalar API reference) from docs/ plus the root openapi.json,
# so the site always serves the canonical spec and no copy is committed under docs/.
#
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# If a run fails, start a fresh one (workflow_dispatch) instead of re-running it:
# re-running the build creates a second github-pages artifact, and the deploy then
# fails with "multiple artifacts".
#

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - openapi.json
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp openapi.json _site/openapi.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
