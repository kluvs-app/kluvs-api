#
# Notifies downstream consumers when openapi.json changes on main.
#
# Triggered by:
#   - push to main — only when openapi.json is modified
#
# Sends a lightweight notification (source_sha + source_repo) via repository_dispatch[api-spec-updated].
# Consumers fetch openapi.json directly from kluvs-api at the given SHA — no spec blob in the payload.
#
# Current consumers:
#   - kluvs-mobile
#
# Secrets required:
#   DISPATCH_PAT — GitHub PAT with repo scope on each consumer repo
#

name: Notify Consumers

on:
  push:
    branches: [main]
    paths:
      - openapi.json

jobs:
  notify:
    name: Dispatch api-spec-updated to consumers
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch to consumers
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
          OWNER: kluvs-app
        run: |
          for REPO in \
            kluvs-mobile \
          ; do
            echo "Dispatching to ${OWNER}/${REPO}..."
            curl -fSs -X POST \
              -H "Authorization: token ${DISPATCH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${OWNER}/${REPO}/dispatches" \
              -d "{\"event_type\":\"api-spec-updated\",\"client_payload\":{\"source_sha\":\"${SOURCE_SHA}\",\"source_repo\":\"${SOURCE_REPO}\"}}"
            echo "✓ Dispatched to ${OWNER}/${REPO}"
          done

      - name: Summary
        if: always()
        run: |
          echo "## Notify Consumers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📤 **Event:** \`api-spec-updated\` dispatched" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Source commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Consumers notified:**" >> $GITHUB_STEP_SUMMARY
          echo "- kluvs-mobile" >> $GITHUB_STEP_SUMMARY
